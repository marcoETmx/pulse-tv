version: 2
updates:
  # The actions in .github/workflows, pinned to commit SHAs.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        patterns: ["*"]
        update-types: [minor, patch]

  # Gradle plugins and libraries, from gradle/libs.versions.toml.
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    groups:
      gradle:
        patterns: ["*"]
        update-types: [minor, patch]
