name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6
        with:
          # The open-source cache; the default "enhanced" provider is a commercial service.
          cache-provider: basic

      # No DATAFAST_TOKEN: without one the app builds with demo data, so CI needs no secrets.
      - name: Unit tests
        run: ./gradlew testDebugUnitTest

      - name: Release build
        run: ./gradlew assembleRelease
