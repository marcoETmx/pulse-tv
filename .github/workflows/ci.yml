name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to commit SHAs; Dependabot updates the SHAs and their version comments.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          # The open-source cache; the default "enhanced" provider is a commercial service.
          cache-provider: basic

      # No DATAFAST_TOKEN: without one the app builds with demo data, so CI needs no secrets.
      - name: Unit tests
        run: ./gradlew testDebugUnitTest

      - name: Release build
        run: ./gradlew assembleRelease
